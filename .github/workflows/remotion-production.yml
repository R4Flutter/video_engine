name: Remotion Production Test

on:
  push:
    branches:
      - clean-doc-push2
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remotion-production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: remotion-documentary

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: remotion-documentary/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Remotion browser
        run: npx remotion browser ensure

      - name: Preflight
        run: node tools/preflight.mjs src

      - name: Typecheck
        run: npm run typecheck

      - name: Render production documentary
        run: npx remotion render ProductionDocumentary out/production-documentary.mp4 --codec=h264 --log=verbose

      - name: Render 5 second documentary shot
        run: npx remotion render DocumentaryShot out/documentary-shot.mp4 --codec=h264 --log=verbose

      - name: Render full effect showcase
        run: npx remotion render Showcase out/showcase.mp4 --codec=h264 --log=verbose

      - name: Verify rendered files
        shell: bash
        run: |
          set -euo pipefail
          test -s out/production-documentary.mp4
          test -s out/documentary-shot.mp4
          test -s out/showcase.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -of json out/production-documentary.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -of json out/documentary-shot.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -of json out/showcase.mp4

      - name: Upload render artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remotion-production-renders
          path: |
            remotion-documentary/out/production-documentary.mp4
            remotion-documentary/out/documentary-shot.mp4
            remotion-documentary/out/showcase.mp4
          if-no-files-found: warn
          retention-days: 7
